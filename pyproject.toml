[project]
dependencies = [
    "dynamicprompts~=0.31.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = [
    ".",
]
markers = [
	"slow"
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "B",
    "C",
    "COM",
    "E",
    "F",
    "I",
    "UP",
]
ignore = [
    "C901",
    "E501",
    "B905",
]
